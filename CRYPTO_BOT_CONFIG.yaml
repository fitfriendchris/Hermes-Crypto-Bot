# COMPLIANCE SECTION
# March 17, 2026: SEC/CFTC jointly published Release 33-11412
# Effective March 23, 2026. Supersedes 2019 FinHub Framework.
# Key changes:
#   - "Most crypto assets are NOT themselves securities"
#   - 16 named digital commodities (BTC, ETH, SOL, XRP, XLM legal)
#   - Investment contracts can END (tokens mature out of securities status)
#   - Safe harbours: staking, mining, airdrops, wrapping
#   - Interpretive release, not statute
# This bot trades ONLY the 16 named digital commodities + DEX micro-caps
# DEX trading is self-custody (no exchange intermediary)
# Operator bears responsibility for tax reporting (1099-K from exchanges)
# Bot is automation tool, not investment advice
# NOT FINANCIAL ADVICE

compliance:
  sec_cftc_release: "33-11412"
  effective_date: "2026-03-23"
  legal_basis: "digital_commodity"
  named_commodities: [BTC, ETH, SOL, XRP, XLM, LTC, BCH, ADA, DOT, MATIC, AVAX, ALGO, LINK, UNI, ATOM]
  jurisdiction: "US_Texas"
  operator_tax_obligation: true
  disclaimer: "This bot is an automation tool. The operator makes all trading decisions. Past performance does not guarantee future results. Cryptocurrency trading carries substantial risk of loss."
  
account:
  starting_balance_usd: 100.00
  current_balance_usd: 100.00
  max_risk_per_trade: 0.10        # 10% of balance (aggressive)
  max_open_positions: 8           # Diversified micro-cap hunting
  max_drawdown_pct: 0.25          # Pause at 25% DD (high tolerance)
  min_trade_size_usd: 5.00        # $5 minimum (fractions of pennies ok)
  compound: true                  # Reinvest profits

# PROFIT PROTECTION
# Move portion of profits to cold storage automatically
profit_protection:
  enabled: true
  cold_wallet_sol: ""        # PASTE SOL ADDRESS HERE (public)
  cold_wallet_eth: ""        # PASTE ETH ADDRESS HERE (public)
  transfer_threshold_usd: 50   # Transfer when accumulated profit >= $50
  transfer_pct: 0.25            # Move 25% to cold, keep 75% for reinvest
  weekly_sweep: true            # Also sweep on Mondays if weekly PnL > threshold

# SECURITY NOTICE
# Private keys are NEVER stored in this file.
# Create .env file locally with:
#   PHANTOM_PRIVATE_KEY=your_phantom_key_here
#   METAMASK_PRIVATE_KEY=your_metamask_key_here
#   BINANCE_API_KEY=your_binance_key_here
#   BINANCE_API_SECRET=your_binance_secret_here
#   TELEGRAM_BOT_TOKEN=your_telegram_token_here
#   TELEGRAM_CHAT_ID=your_chat_id_here
# .env is in .gitignore — never committed to version control.

