execution:
  exchange: binance               # Primary for majors
  dex_primary: jupiter            # For SOL memes
  dex_secondary: raydium          # Backup DEX
  dex_scanner: dexscreener        # For micro-cap discovery
  pumpfun: true                   # Monitor pump.fun launches
  use_websocket: true
  max_slippage_pct: 0.03          # 3% for micro-caps (tolerable)
  latency_target_ms: 1000         # 1s acceptable for micro-caps
  gas_priority: high              # Fast execution on DEX

risk_filter:
  # Micro-cap adjusted scoring
  min_scam_score: 40              # Lower threshold (micro-caps riskier)
  require_liquidity_locked: true
  require_audit: false            # Most micro-caps unaudited
  max_holder_concentration: 0.50  # Top 10 < 50% (micro-cap reality)
  min_volume_24h: 10000           # $10K daily ok for micro
  min_liquidity_usd: 5000         # $5K liquidity minimum
  max_contract_age_days: 7          # Allow fresh launches
  
  # Rug pull detection
  honey_pot_check: true
  mint_function_check: true
  ownership_renounced_check: true
  lp_burned_check: true           # LP must be burned or locked
  dev_wallet_sell_check: true     # Flag dev selling

ict:
  enabled: true
  timeframes: ["5m", "15m", "1h", "4h"]
  require_bos: false              # Micro-caps too volatile
  require_fvg: false
  require_liquidity_sweep: false
  use_volume_profile: true
  use_market_structure: true

stop_loss:
  method: smart                   # structure > whale > fvg > liquidity > atr
  fixed_pct: 0.15                 # 15% hard max for micro-caps
  atr_multiplier: 3.0             # Wider for volatility
  trail_after_r: 2.0
  
  # Micro-cap specific
  time_stop_hours: 72             # 3 day max hold
  momentum_stop: true             # Exit if volume drops 50%
  liquidity_collapse_stop: true   # Exit if liquidity drops 30%
  dev_sell_stop: true             # Exit if dev wallet sells >5%

take_profit:
  method: tiered                  # Tiered exit strategy
  risk_reward_ratio: 5.0          # 5:1 minimum (micro-cap targets)
  
  # Tiered exit for runners
  tier_1_r: 2.0                   # Sell 25% at 2R
  tier_2_r: 5.0                   # Sell 25% at 5R
  tier_3_r: 10.0                  # Sell 25% at 10R
  tier_4_r: 50.0                  # Sell 15% at 50R (moon bag)
  final_trail_pct: 0.20           # Trail final 10% at 20% below peak
  
  # Market cap milestones
  mc_target_1: 1000000            # $1M MC — consider partial exit
  mc_target_2: 10000000            # $10M MC — consider major exit
  mc_target_3: 50000000            # $50M MC — likely full exit

coin_selection:
  # Major anchors (stability)
  majors:
    - BTC
    - ETH
    - SOL
    - XRP
    - XLM
  
  # Micro-cap discovery
  discovery_sources:
    - dexscreener                   # Trending pairs
    - pumpfun                       # New launches
    - birdeye                       # SOL ecosystem
    - dextools                      # ETH/BSC pairs
    - twitter_viral                 # Social signals
    - whale_wallets                 # Whale accumulation
  
  # Filters
  min_market_cap: 10000            # $10K minimum
  max_market_cap: 10000000        # $10M maximum (micro-cap zone)
  min_volume_24h: 5000             # $5K daily
  require_dex_listed: true
  max_age_hours: 168               # < 7 days old preferred

whales:
  track_count: 50                 # Fewer, focused on micro-cap hunters
  min_score: 60
  focus: micro_cap_specialists      # Track whales who specialize in micros
  min_trade_size_usd: 1000         # $1K significant for micro-caps

logging:
  level: info
  telegram_alerts: true
  daily_report: true
  pnl_update_interval: 300        # 5 min PnL updates

# AGGRESSIVE GROWTH SETTINGS
aggressive_mode:
  enabled: true
  pyramiding: true                # Add to winners
  pyramiding_trigger: 2.0         # Add when position up 2R
  max_pyramid_adds: 2             # Max 2 additions
  
  dip_buying: true                # Buy dips on trending coins
  dip_threshold: 0.20             # Buy 20% dip from local high
  
  fomo_override: true             # If 3+ whales buy same new coin in 1h
  fomo_position_size: 0.15        # 15% on fomo (high risk)
  
  ico_presale: false               # NO presales (too risky)
  airdrop_farming: false           # NO airdrops (time waste)

# SAFETY CIRCUITS
safety:
  max_daily_loss_usd: 25.00        # Stop trading if -$25 day
  max_weekly_loss_usd: 50.00      # Stop if -$50 week
  max_consecutive_losses: 5       # Pause after 5 losses
  cooldown_hours: 24              # 24h cooldown after circuit
  
  # Rug pull emergency
  instant_exit_signals:
    - liquidity_removed_50pct
    - dev_wallet_dump_20pct
    - contract_upgraded
    - trading_paused
    - honeypot_detected
    - socials_deleted

# PERFORMANCE TARGETS
targets:
  monthly_growth_pct: 100          # 100% month (double $100 to $200)
  quarterly_growth_pct: 400       # 4x in 3 months ($100 → $400)
  annual_growth_pct: 10000        # 100x in year ($100 → $10K)
  
  # Reality checks
  expected_win_rate: 0.35         # 35% (micro-cap reality)
  expected_avg_winner: 5.0         # 5R average win
  expected_avg_loser: 1.0         # 1R average loss
  expected_expectancy: 0.75        # Positive expectancy
