# ── SYMBOL QUALITY CLASSIFICATION ──
# One-time scan symbols are micro-cap momentum trades
# Long-term holds are verified assets with CEX potential
# Permanent blacklist prevents churn

symbol_filter:
  # One-time momentum scan tokens:
  # These are ONLY traded once during initial pump
  # If they reappear in scanner, they are SKIPPED
  one_time_max_trades: 1
  
  # Long-term eligible symbols (institutional grade):
  # These CAN be re-traded if criteria are met
  long_term_symbols:
    criteria:
      min_mcap_usd: 100000000      # $100M+ market cap
      min_age_days: 90              # 3+ months old
      cex_listings: [coinbase, binance, kraken]
      holder_count: 10000
      liquidity_usd: 5000000
      volume_24h: 1000000
      social_score: 70              # LunarCrush or similar
      team_verified: true
      audit_passed: true
    
  # Permanent blacklist (churning symbols)
  permanent_blacklist:
    - ACTCREW
    - CHIP
    - CLICKCLACK
    - Eileen
    - NICHEBABY
    - MRP
    - PASTEL
    - anon
    - KITTY
    - FAH
    
  # Dynamic blacklist (auto-added after 2 losses)
  dynamic_blacklist_ttl_hours: 168  # 7 days
  
  # Cooldown after profit (don't re-buy immediately)
  profit_cooldown_hours: 72
  
  # Maximum total trades per symbol (lifetime)
  max_lifetime_trades: 3
  require_fvg: false
  require_liquidity_sweep: false
  use_volume_profile: true
  use_market_structure: true

stop_loss:
  method: smart
  fixed_pct: 0.15                 # 15% hard stop (was 25%) — cut losses faster
  atr_multiplier: 2.0             # Tighter ATR multiplier
  trail_after_r: 2.0

  # Micro-cap specific
  time_stop_hours: 36             # 36h max hold — micro-cap pumps resolve in 24-36h
  momentum_stop: true
  liquidity_collapse_stop: true
  dev_sell_stop: true

take_profit:
  method: two_tier_fast           # Optimized: take money fast, trail runners

  # Exit 1: sell 50% at +20% → locks profit, moves stop to breakeven+2%
  exit_1_pct: 0.20

  # Exit 2: sell remaining 50% at +50%
  exit_2_pct: 0.50

  # Trailing stop: 12% below rolling peak (activates after Exit 1)
  trail_pct: 0.12

  # Legacy fields (kept for reference, not used by new exit logic)
  tier_1_r: 1.33                  # +20% with 15% stop ≈ 1.33R
  tier_2_r: 3.33                  # +50% with 15% stop ≈ 3.33R

