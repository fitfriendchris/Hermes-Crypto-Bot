# SAFETY CIRCUITS
safety:
  max_daily_loss_usd: 25.00        # Stop trading if -$25 day
  max_weekly_loss_usd: 50.00      # Stop if -$50 week
  max_consecutive_losses: 5       # Pause after 5 losses
  cooldown_hours: 24              # 24h cooldown after circuit
  
  # Rug pull emergency
