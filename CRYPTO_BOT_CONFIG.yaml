# Hermes Crypto Bot — Solana Base Coins + BTC Hedge
# Purpose: Fund Sovereign businesses through crypto trading
# Chain: Solana primary, BTC as hedge anchor
# Strategy: Base coin accumulation + micro-cap alpha

account:
  starting_balance_usd: 1000.0
  current_balance_usd: 1000.0
  max_risk_per_trade_pct: 3.0
  max_open_positions: 8
  max_daily_loss_usd: 50.0
  max_drawdown_pct: 20.0
  max_consecutive_losses: 7
  cooldown_hours: 1
  min_trade_size_usd: 2.50
  max_trade_size_usd: 50.0
  position_size_hard_cap_pct: 0.05
  risk_budget_per_trade_pct: 0.02
  compound: true
  high_attention_mode: true

chain:
  primary: solana
  secondary: ethereum
  btc_hedge: true

# SOLANA BASE COINS — Established, liquid, lower rug risk
base_coins:
  tier_1:  # Majors — 60% allocation
    - symbol: SOL
      allocation_pct: 25
      type: native
      min_holding_usd: 250
    - symbol: USDC
      allocation_pct: 20
      type: stable
      min_holding_usd: 200
    - symbol: JUP
      allocation_pct: 15
      type: dex_token
      min_holding_usd: 150
  
  tier_2:  # Growth — 25% allocation
    - symbol: JTO
      allocation_pct: 8
      type: infrastructure
    - symbol: RAY
      allocation_pct: 7
      type: dex_token
    - symbol: ORCA
      allocation_pct: 5
      type: dex_token
    - symbol: BONK
      allocation_pct: 5
      type: meme
  
  tier_3:  # Micro-cap alpha — 15% allocation
    discovery: true
    max_allocation_pct: 5
    max_positions: 5
    high_attention_mode: true
    sources:
      - dexscreener
      - birdeye
      - pumpfun
    # High-attention micro coins — manual watchlist
    watchlist:
      - symbol: ATTENTION
        mint: 52xfJnaHZzxAddm74SVyxmdyLJ6qrrW8WN2U3SjmxaVB
        allocation_pct: 3
        type: micro_attention
        min_holding_usd: 30
        max_position_usd: 100
        strategy: trending_meme_scalper
        entry_trigger: volume_spike_3x
        take_profit_r: 4.0
        stop_loss_pct: 20
        time_stop_hours: 48

# BTC HEDGE — Anchor against SOL ecosystem drawdown
btc_hedge:
  enabled: true
  allocation_pct: 10
  trigger: sol_btc_ratio_drop  # Add BTC when SOL/BTC ratio drops 10%
  instrument: btc_perp  # Use BTC-PERP on Drift or similar
  rebalance_threshold_pct: 5

execution:
  dex_primary: jupiter
  dex_secondary: raydium
  dex_tertiary: orca
  aggregator: jupiter  # Best Solana prices
  max_slippage_pct: 0.01  # 1% max for base coins
  latency_target_ms: 500
  gas_priority: high
  use_priority_fees: true
  priority_fee_micro_lamports: 10000

risk_filter:
  min_liquidity_usd: 50000  # $50K minimum — filter out thin pools
  min_volume_24h_usd: 25000  # $25K daily volume minimum
  max_holder_concentration: 0.25  # Top 10 < 25%
  require_liquidity_locked: true
  require_audit: false
  max_contract_age_days: 30  # NEW: Only trade tokens < 30 days old (fresh momentum)
  
  # NEW: Minimum quality requirements
  min_holders: 50  # At least 50 holders (lowered for micro access)
  min_transactions_24h: 30  # At least 30 txns/day
  
  # Rug pull detection
  honey_pot_check: true
  mint_function_check: true
  ownership_renounced_check: false  # Too strict for micro-caps
  lp_burned_check: false  # Too strict for micro-caps
  dev_wallet_sell_check: true
  
  # Whale tracking
  whale_min_trade_usd: 5000
  whale_track_count: 10

strategy:
  # Base coin accumulation — DCA style
  dca:
    enabled: true
    interval_hours: 24
    amount_usd: 20
    coins: [SOL, JUP, JTO]
  
  # Momentum strategy for tier 2 + high-attention micros
  momentum:
    enabled: true
    timeframe: 4h
    lookback_periods: 6
    min_volume_spike: 2.0  # 2× volume surge
    entry_confidence: 60   # 60+ score for micro-cap entries
    min_1h_change_pct: 5.0  # ULTRA: +5% 1h for stronger momentum
    max_24h_change_pct: 500  # ULTRA: Allow 500% runners (catch mooners)
    
  # Trending meme scalper — high-attention micro coins
  trending_meme:
    enabled: true
    mode: high_attention  # Focus on ATTENTION and similar
    watchlist:
      - ATTENTION
    position_pct: 0.03   # 3% per trade
    target_pct: 0.05     # +5% take profit
    time_stop_hours: 48
    max_positions: 20
    min_liquidity: 20000  # $20K minimum for micros
    min_volume_24h: 10000
    min_holders: 50
    max_token_age_days: 14  # ULTRA: Only fresh <14 day tokens (higher momentum)
    sources:
      - dexscreener
      - geckoterminal
    auto_discover: true  # Find similar high-attention tokens
    
  # Arbitrage between DEXs
  arbitrage:
    enabled: true
    min_profit_pct: 0.5
    max_slippage_pct: 0.5
    sources: [jupiter, raydium, orca]
  
  # Yield farming for stablecoins
  yield:
    enabled: true
    platforms: [kamino, marginfi, drift]
    min_apy_pct: 5
    max_risk_score: 3

stop_loss:
  method: smart
  fixed_pct: 35.0  # ULTRA: 35% for micro-caps (15%→25%→35% — data proves wider = profitable)
  floor_pct: 0.35  # ULTRA: 35% absolute minimum stop width
  cap_pct: 0.50   # ULTRA: 50% max stop for extreme volatility tokens
  atr_multiplier: 3.0  # Wider ATR stop
  trail_after_r: 2.0  # Trail only after 2R profit
  time_stop_hours: 168  # ULTRA: 7-day hold for winners (data: +1.73 avg after 1h+)

take_profit:
  method: tiered
  risk_reward_ratio: 4.0  # Higher R:R target
  tier_1_r: 1.5  # ULTRA: Sell 25% at 1.5R (faster profit capture)
  tier_2_r: 3.0  # ULTRA: Sell 25% at 3R
  tier_3_r: 5.0  # ULTRA: Sell 25% at 5R
  final_trail_pct: 25.0  # ULTRA: 25% trail for final 25% (let runners run)

# PROFIT PROTECTION — Fund Sovereign businesses
profit_protection:
  enabled: true
  cold_wallet_sol: ""  # Fill in your SOL cold wallet
  transfer_threshold_usd: 100
  transfer_pct: 0.50  # Send 50% of profits to cold storage
  weekly_sweep: true
  sweep_day: monday
  
  # Treasury integration
  treasury_split:
    operator: 0.50  # 50% to operator
    reinvest: 0.30  # 30% reinvest
    war_chest: 0.20  # 20% to Sovereign war chest

# HEDGING
hedge:
  enabled: true
  
  # BTC hedge against SOL drawdown
  btc_perp:
    enabled: true
    exchange: drift
    size_pct_of_portfolio: 10
    trigger_long: sol_btc_ratio_drop_10pct
    trigger_close: sol_btc_ratio_recover_5pct
  
  # Options for catastrophic protection (if available)
  options:
    enabled: false  # Requires options DEX (PsyOptions, etc.)
    platform: psyoptions
    strike_otm_pct: 10
    expiry_days: 7
    premium_budget_pct: 2

# MULTI-SOURCE INTELLIGENCE
intelligence:
  # On-chain data
  birdeye:
    enabled: true
    api_tier: free
  
  dexscreener:
    enabled: true
  
  # Whale tracking
  solscan:
    enabled: true
    track_wallets:
      - "H8sMJSCQxfKiWRuNuG5KHr7fFKbQBFK3M6b5fH4R4G2T"  # Example whale
  
  # Social signals
  twitter:
    enabled: false  # Requires API keys
    min_mentions: 100
  
  # AI4Trade signals
  ai4trade:
    enabled: true
    agent_id: 5953
    follow_signals: true
    validate_with_onchain: true

# BACKTESTING
backtest:
  enabled: true
  data_source: birdeye_historical
  lookback_days: 90
  walk_forward: true
  report_metrics:
    - sharpe_ratio
    - max_drawdown
    - win_rate
    - profit_factor
    - expectancy

# SCHEDULER
scheduler:
  discovery_interval_sec: 60
  monitor_interval_sec: 10
  report_interval_sec: 300
  save_interval_sec: 60
  dca_interval_hours: 24
  rebalance_interval_hours: 168  # Weekly

# ALERTS
alerts:
  telegram: true
  on_entry: true
  on_exit: true
  on_stop_loss: true
  on_take_profit: true
  on_daily_summary: true
  on_drawdown_alert: true
  on_profit_transfer: true

logging:
  level: INFO
  file: logs/crypto_bot.log
  max_size_mb: 10
  backup_count: 5

# SAFETY CIRCUITS
safety:
  max_daily_loss_usd: 50
  max_weekly_loss_usd: 150
  max_monthly_loss_usd: 300
  cooldown_after_loss_hours: 24
  
  # Circuit breakers
  circuit_breakers:
    - name: daily_loss
      trigger: daily_pnl <= -50
      action: pause_trading
    - name: drawdown
      trigger: max_drawdown_pct >= 10
      action: close_all_positions
    - name: sol_crash
      trigger: sol_price_drop_24h >= 20
      action: hedge_with_btc_perp

# PERFORMANCE TARGETS
targets:
  monthly_return_pct: 15
  max_drawdown_pct: 10
  sharpe_ratio: 1.5
  
  # Business funding goals
  monthly_profit_target_usd: 150  # $150/month to fund Sovereign
  quarterly_profit_target_usd: 500
  annual_profit_target_usd: 2000
